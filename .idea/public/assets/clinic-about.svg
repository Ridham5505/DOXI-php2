<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!-- Background -->
  <defs>
    <linearGradient id="clinicSkyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clinicBuildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clinicDoorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="600" height="600" fill="url(#clinicSkyGradient)"/>
  
  <!-- Modern clinic building -->
  <rect x="200" y="180" width="200" height="300" rx="15" fill="url(#clinicBuildingGradient)"/>
  
  <!-- Building roof detail -->
  <rect x="190" y="170" width="220" height="25" rx="12" fill="#1e40af"/>
  
  <!-- Main entrance with glass doors -->
  <rect x="255" y="380" width="90" height="100" rx="8" fill="url(#clinicDoorGradient)"/>
  <rect x="265" y="390" width="35" height="85" rx="4" fill="#93c5fd" opacity="0.6"/>
  <rect x="305" y="390" width="35" height="85" rx="4" fill="#93c5fd" opacity="0.6"/>
  
  <!-- Windows row 1 (top) -->
  <rect x="220" y="220" width="35" height="45" rx="6" fill="#dbeafe" opacity="0.9"/>
  <rect x="270" y="220" width="35" height="45" rx="6" fill="#bfdbfe" opacity="0.9"/>
  <rect x="320" y="220" width="35" height="45" rx="6" fill="#dbeafe" opacity="0.9"/>
  
  <!-- Windows row 2 (middle) -->
  <rect x="220" y="280" width="35" height="45" rx="6" fill="#bfdbfe" opacity="0.9"/>
  <rect x="270" y="280" width="35" height="45" rx="6" fill="#dbeafe" opacity="0.9"/>
  <rect x="320" y="280" width="35" height="45" rx="6" fill="#bfdbfe" opacity="0.9"/>
  
  <!-- Medical cross on roof -->
  <circle cx="300" cy="165" r="25" fill="#ffffff"/>
  <rect x="295" y="145" width="10" height="40" fill="#ef4444"/>
  <rect x="280" y="160" width="40" height="10" fill="#ef4444"/>
  
  <!-- Steps/Stairs -->
  <rect x="250" y="480" width="100" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="255" y="488" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="260" y="496" width="80" height="8" rx="4" fill="#64748b"/>
  
  <!-- Side wing (left) -->
  <rect x="140" y="240" width="70" height="180" rx="10" fill="#60a5fa"/>
  <rect x="155" y="260" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.8"/>
  <rect x="155" y="310" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.8"/>
  <rect x="190" y="260" width="15" height="90" rx="3" fill="#1e40af"/>
  
  <!-- Side wing (right) -->
  <rect x="390" y="240" width="70" height="180" rx="10" fill="#60a5fa"/>
  <rect x="420" y="260" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.8"/>
  <rect x="420" y="310" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.8"/>
  <rect x="390" y="260" width="15" height="90" rx="3" fill="#1e40af"/>
  
  <!-- Ground/Pathway -->
  <rect x="0" y="510" width="600" height="90" fill="#e2e8f0"/>
  <rect x="220" y="510" width="160" height="90" fill="#cbd5e1"/>
  
  <!-- Trees/Greenery (left) -->
  <circle cx="100" cy="520" r="30" fill="#22c55e"/>
  <circle cx="80" cy="515" r="20" fill="#16a34a"/>
  <rect x="95" y="545" width="10" height="30" fill="#a16207"/>
  
  <!-- Trees/Greenery (right) -->
  <circle cx="500" cy="520" r="30" fill="#22c55e"/>
  <circle cx="520" cy="515" r="20" fill="#16a34a"/>
  <rect x="495" y="545" width="10" height="30" fill="#a16207"/>
  
  <!-- Decorative medical elements -->
  <!-- Stethoscope icon on door -->
  <circle cx="300" cy="420" r="8" fill="#ffffff"/>
  <path d="M 300 420 Q 320 410 335 420" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Parking lot lines -->
  <rect x="130" y="530" width="50" height="3" rx="1" fill="#94a3b8" opacity="0.5"/>
  <rect x="420" y="530" width="50" height="3" rx="1" fill="#94a3b8" opacity="0.5"/>
</svg>

