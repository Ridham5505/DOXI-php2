<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#f9fafb"/>
  
  <!-- Left Side: Smartphone -->
  <g transform="translate(50, 80)">
    <!-- Phone body -->
    <rect x="0" y="0" width="180" height="320" rx="25" fill="url(#phoneGradient)"/>
    <rect x="5" y="5" width="170" height="310" rx="20" fill="#ffffff"/>
    
    <!-- Screen -->
    <rect x="10" y="20" width="160" height="270" rx="15" fill="url(#screenGradient)"/>
    
    <!-- App Header -->
    <rect x="10" y="20" width="160" height="40" rx="15" fill="#3b82f6"/>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">DOXI</text>
    
    <!-- Appointment Card -->
    <rect x="20" y="75" width="140" height="50" rx="8" fill="#dcfce7" opacity="0.9"/>
    <text x="25" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Dr. John Smith</text>
    <text x="25" y="110" font-family="Arial, sans-serif" font-size="10" fill="#15803d">Appointment Today</text>
    
    <!-- Menu Items -->
    <circle cx="30" cy="155" r="8" fill="#3b82f6"/>
    <text x="45" y="160" font-family="Arial, sans-serif" font-size="11" fill="#374151">Medical Records</text>
    
    <circle cx="30" cy="185" r="8" fill="#ef4444"/>
    <text x="45" y="190" font-family="Arial, sans-serif" font-size="11" fill="#374151">Prescriptions</text>
    
    <circle cx="30" cy="215" r="8" fill="#22c55e"/>
    <text x="45" y="220" font-family="Arial, sans-serif" font-size="11" fill="#374151">Health Tips</text>
    
    <!-- Navigation Bar -->
    <rect x="10" y="255" width="160" height="35" rx="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="30" cy="272" r="5" fill="#3b82f6"/>
    <circle cx="70" cy="272" r="5" fill="#9ca3af"/>
    <circle cx="110" cy="272" r="5" fill="#9ca3af"/>
    <circle cx="150" cy="272" r="5" fill="#9ca3af"/>
    
    <!-- Connected Icons around phone -->
    <g opacity="0.8">
      <circle cx="90" cy="20" r="25" fill="#3b82f6" opacity="0.2"/>
      <path d="M 75 75 L 90 30" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
      <text x="90" y="28" font-family="Arial" font-size="20" text-anchor="middle">🩺</text>
      
      <circle cx="240" cy="70" r="25" fill="#3b82f6" opacity="0.2"/>
      <path d="M 165 85 L 235 70" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
      <text x="240" y="78" font-family="Arial" font-size="20" text-anchor="middle">💊</text>
      
      <circle cx="240" cy="220" r="25" fill="#3b82f6" opacity="0.2"/>
      <path d="M 165 200 L 235 220" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
      <text x="240" y="228" font-family="Arial" font-size="20" text-anchor="middle">📋</text>
      
      <circle cx="90" cy="340" r="25" fill="#3b82f6" opacity="0.2"/>
      <path d="M 75 285 L 90 335" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
      <text x="90" y="348" font-family="Arial" font-size="20" text-anchor="middle">📅</text>
      
      <circle cx="0" cy="170" r="25" fill="#3b82f6" opacity="0.2"/>
      <path d="M 20 170 L 15 170" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
      <text x="0" y="178" font-family="Arial" font-size="20" text-anchor="middle">👤</text>
    </g>
  </g>
  
  <!-- Right Side: Doctor and Patient -->
  <g transform="translate(280, 50)">
    <!-- Doctor -->
    <circle cx="120" cy="80" r="35" fill="#fbbf24"/>
    <rect x="95" y="115" width="50" height="80" rx="5" fill="#3b82f6"/>
    <rect x="100" y="120" width="40" height="50" rx="3" fill="#ffffff"/>
    <rect x="105" y="125" width="30" height="40" rx="2" fill="#60a5fa"/>
    <circle cx="120" cy="135" r="8" fill="#ffffff"/>
    <!-- Stethoscope -->
    <circle cx="115" cy="88" r="5" fill="#ef4444"/>
    <path d="M 110 88 Q 100 95 90 100" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Patient -->
    <circle cx="180" cy="110" r="30" fill="#fbbf24"/>
    <ellipse cx="180" cy="150" rx="35" ry="60" fill="#fca5a5"/>
    <path d="M 145 150 Q 180 140 215 150" stroke="#ef4444" stroke-width="2" fill="none"/>
    
    <!-- Hands connecting -->
    <ellipse cx="150" cy="180" rx="12" ry="8" fill="#fbbf24" opacity="0.8"/>
    <ellipse cx="170" cy="178" rx="12" ry="8" fill="#fbbf24" opacity="0.8"/>
    
    <!-- Background blur effect -->
    <rect x="60" y="40" width="200" height="200" rx="20" fill="#e0f2fe" opacity="0.3"/>
    <rect x="70" y="50" width="180" height="180" rx="15" fill="#dbeafe" opacity="0.2"/>
  </g>
  
  <!-- Connecting line between sections -->
  <line x1="230" y1="200" x2="280" y2="200" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5,5" opacity="0.5"/>
</svg>

