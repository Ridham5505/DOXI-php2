<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!-- Background -->
  <rect width="600" height="600" fill="#f0f9ff"/>
  
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="600" height="600" fill="url(#skyGradient)"/>
  
  <!-- Main hospital building -->
  <rect x="150" y="200" width="300" height="350" rx="10" fill="url(#buildingGradient)"/>
  
  <!-- Building windows (left side) -->
  <rect x="180" y="250" width="40" height="50" rx="5" fill="#93c5fd" opacity="0.8"/>
  <rect x="180" y="320" width="40" height="50" rx="5" fill="#93c5fd" opacity="0.8"/>
  <rect x="180" y="390" width="40" height="50" rx="5" fill="#dbeafe" opacity="0.8"/>
  
  <!-- Building windows (middle) -->
  <rect x="270" y="250" width="40" height="50" rx="5" fill="#93c5fd" opacity="0.8"/>
  <rect x="270" y="320" width="40" height="50" rx="5" fill="#dbeafe" opacity="0.8"/>
  <rect x="270" y="390" width="40" height="50" rx="5" fill="#93c5fd" opacity="0.8"/>
  
  <!-- Building windows (right side) -->
  <rect x="360" y="250" width="40" height="50" rx="5" fill="#dbeafe" opacity="0.8"/>
  <rect x="360" y="320" width="40" height="50" rx="5" fill="#93c5fd" opacity="0.8"/>
  <rect x="360" y="390" width="40" height="50" rx="5" fill="#93c5fd" opacity="0.8"/>
  
  <!-- Main entrance -->
  <rect x="255" y="470" width="90" height="80" rx="5" fill="#1e3a8a"/>
  <rect x="265" y="485" width="70" height="60" rx="3" fill="#3b82f6"/>
  
  <!-- Medical cross on roof -->
  <circle cx="300" cy="180" r="30" fill="#ffffff"/>
  <rect x="295" y="155" width="10" height="50" fill="#ef4444"/>
  <rect x="275" y="175" width="50" height="10" fill="#ef4444"/>
  
  <!-- Secondary building (left) -->
  <rect x="100" y="300" width="120" height="200" rx="8" fill="#60a5fa"/>
  <rect x="120" y="330" width="30" height="40" rx="4" fill="#dbeafe" opacity="0.7"/>
  <rect x="120" y="390" width="30" height="40" rx="4" fill="#dbeafe" opacity="0.7"/>
  <rect x="170" y="330" width="30" height="40" rx="4" fill="#dbeafe" opacity="0.7"/>
  <rect x="170" y="390" width="30" height="40" rx="4" fill="#dbeafe" opacity="0.7"/>
  
  <!-- Secondary building (right) -->
  <rect x="380" y="280" width="100" height="220" rx="8" fill="#60a5fa"/>
  <rect x="395" y="310" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.7"/>
  <rect x="395" y="365" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.7"/>
  <rect x="430" y="310" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.7"/>
  <rect x="430" y="365" width="25" height="35" rx="4" fill="#dbeafe" opacity="0.7"/>
  
  <!-- Ground/Base -->
  <rect x="0" y="550" width="600" height="50" fill="#e5e7eb"/>
  <rect x="0" y="545" width="600" height="5" fill="#9ca3af"/>
  
  <!-- Trees/Plants (decorative) -->
  <circle cx="80" cy="540" r="25" fill="#22c55e"/>
  <circle cx="520" cy="535" r="30" fill="#22c55e"/>
  <circle cx="50" cy="550" r="15" fill="#16a34a"/>
  <circle cx="550" cy="545" r="20" fill="#16a34a"/>
</svg>

